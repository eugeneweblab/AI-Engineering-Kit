name: knowledge-guardrails

# Protects the knowledge base from the regression classes past audits found:
#   1. empty/stub docs marked `status: ready` (agents filter INDEX.json for ready docs)
#   2. INDEX.json / INDEX.md drifting out of sync with the docs' frontmatter
#   3. broken cross-links, structural gaps, and code blocks that do not parse in the
#      language they are tagged with (wrong fence tag, invalid YAML, shell-hostile
#      placeholders) — none of which are visible by inspection
#   4. agent-facing instructions drifting from the base they describe: a field the
#      protocol names but the index does not expose, a lookup that resolves to nothing
on:
  push:
    paths:
      - "knowledge/**"
      - "scripts/**"
      - ".github/workflows/knowledge-guardrails.yml"
  pull_request:
    paths:
      - "knowledge/**"
      - "scripts/**"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # One parser per block language: PyYAML, sqlfluff, crossplane (nginx),
      # python-hcl2 (Terraform), graphql-core. PHP and Node ship with the runner;
      # html-validate, stylelint and esbuild are fetched by npx on first use.
      - name: Install checker dependencies
        run: python3 -m pip install --quiet pyyaml sqlfluff crossplane python-hcl2 graphql-core

      # Go is here only for `gofmt -e`; there is no module to build, so the
      # dependency cache has no `go.sum` to key on and warns on every run.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Install lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Warm the npx cache
        run: |
          npx --yes html-validate@8 --version
          npx --yes stylelint@16 --version
          npx --yes esbuild@0.24.0 --version

      - name: No stub marked ready
        run: python3 scripts/check-ready-not-stub.py knowledge

      # Hands every fenced block to the parser for its language. --require-tools turns
      # a missing parser into a failure: without it a silently failed install leaves the
      # build green while eight languages go unchecked.
      - name: Structure, links, and code blocks
        run: python3 scripts/check-knowledge.py knowledge --require-tools

      - name: SIGNALS is in sync with frontmatter
        run: |
          python3 scripts/build-signals.py
          if ! git diff --quiet -- knowledge/SIGNALS.json; then
            echo "::error::SIGNALS.json is stale. Run 'python3 scripts/build-signals.py' and commit the result."
            exit 1
          fi
          echo "SIGNALS is up to date."

      - name: Agent instructions are executable
        run: |
          python3 scripts/check-agent-instructions.py --selftest
          python3 scripts/check-agent-instructions.py

      - name: INDEX is in sync with frontmatter
        run: |
          python3 scripts/build-index.py
          if ! git diff --quiet -- knowledge/INDEX.json knowledge/INDEX.md; then
            echo "::error::INDEX.json/INDEX.md are stale. Run 'python3 scripts/build-index.py' and commit the result."
            git --no-pager diff --stat -- knowledge/INDEX.json knowledge/INDEX.md
            exit 1
          fi
          echo "INDEX is up to date."

      # The one defect class that appears with nobody editing a file: a runtime
      # named in an example outlives its support window. Reads from a committed
      # snapshot, so this step needs no network.
      - name: No document recommends an unsupported runtime
        run: python3 scripts/check-versions.py

      # An agent copies from this base, so a construct that executes or injects
      # ships. Each one must either warn about itself in place or be reviewed.
      - name: Every executing construct is warned about or reviewed
        run: python3 scripts/check-dangerous-sinks.py

      # Valid YAML is a much weaker claim than a valid manifest. Each format is
      # checked by the tool that would actually consume it.
      - name: Install manifest validators
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kc.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kc.tar.gz -C /tmp kubeconform && sudo mv /tmp/kubeconform /usr/local/bin/
          curl -fsSL -o /tmp/al.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf /tmp/al.tar.gz -C /tmp actionlint && sudo mv /tmp/actionlint /usr/local/bin/

      - name: Manifests are valid to the tools that consume them
        run: python3 scripts/check-manifests.py --require-tools

      # Parsing a TypeScript block proves syntax and nothing else. This compiles
      # them against the real libraries, which is where a wrong signature shows up.
      - name: TypeScript examples compile against real libraries
        run: |
          python3 scripts/check-types.py --refresh-env
          python3 scripts/check-types.py

      # `bash -n` proves a shell block parses. `for f in $(ls *.log)` parses too.
      # Pinned: a different shellcheck emits a different set of diagnostics, and the
      # baseline is a record of what was reviewed, not of what one machine happens to
      # report. An unpinned linter makes CI and a laptop disagree.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | grep version

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install ruff
        run: python3 -m pip install --quiet ruff

      - name: Install tflint
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          unzip -oq /tmp/tflint.zip -d /tmp && sudo install /tmp/tflint /usr/local/bin/tflint

      - name: Examples pass their language's linter
        run: |
          python3 scripts/check-lint.py --refresh-env
          python3 scripts/check-lint.py --require-tools

      # A guardrail that passes is only evidence when it can fail. Twice in this
      # repository a check reported success while doing nothing. These two inject
      # real defects and fail if any goes unreported.
      - name: Guardrails catch injected defects
        run: python3 scripts/selftest-guardrails.py

      - name: An agent following the protocol reaches the right rule
        run: python3 scripts/selftest-retrieval.py --ablate
