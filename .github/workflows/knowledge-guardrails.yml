name: knowledge-guardrails

# Protects the knowledge base from the regression classes past audits found:
#   1. empty/stub docs marked `status: ready` (agents filter INDEX.json for ready docs)
#   2. INDEX.json / INDEX.md drifting out of sync with the docs' frontmatter
#   3. broken cross-links, structural gaps, and code blocks that do not parse in the
#      language they are tagged with (wrong fence tag, invalid YAML, shell-hostile
#      placeholders) — none of which are visible by inspection
on:
  push:
    paths:
      - "knowledge/**"
      - "scripts/**"
      - ".github/workflows/knowledge-guardrails.yml"
  pull_request:
    paths:
      - "knowledge/**"
      - "scripts/**"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PyYAML parses YAML blocks; sqlfluff parses SQL. PHP and Node ship with the
      # runner. html-validate and stylelint are fetched by npx on first use.
      - name: Install checker dependencies
        run: python3 -m pip install --quiet pyyaml sqlfluff

      - name: Warm the npx cache
        run: |
          npx --yes html-validate@8 --version
          npx --yes stylelint@16 --version
          npx --yes esbuild@0.24.0 --version

      - name: No stub marked ready
        run: python3 scripts/check-ready-not-stub.py knowledge

      # Hands every fenced block to the parser for its language: bash -n, php -l,
      # esbuild, sqlfluff, html-validate, stylelint, plus PyYAML/JSON/XML/ast in
      # process. A tool that cannot run is reported as a skip, never passed silently.
      - name: Structure, links, and code blocks
        run: python3 scripts/check-knowledge.py knowledge

      - name: SIGNALS is in sync with frontmatter
        run: |
          python3 scripts/build-signals.py
          if ! git diff --quiet -- knowledge/SIGNALS.json; then
            echo "::error::SIGNALS.json is stale. Run 'python3 scripts/build-signals.py' and commit the result."
            exit 1
          fi
          echo "SIGNALS is up to date."

      - name: INDEX is in sync with frontmatter
        run: |
          python3 scripts/build-index.py
          if ! git diff --quiet -- knowledge/INDEX.json knowledge/INDEX.md; then
            echo "::error::INDEX.json/INDEX.md are stale. Run 'python3 scripts/build-index.py' and commit the result."
            git --no-pager diff --stat -- knowledge/INDEX.json knowledge/INDEX.md
            exit 1
          fi
          echo "INDEX is up to date."
